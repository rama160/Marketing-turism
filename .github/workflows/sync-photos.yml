name: Sync licensed destination photos
on:
  push:
    branches: [main]
    paths:
      - scripts/sync-photos.mjs
      - .github/workflows/sync-photos.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marketing-turism-photo-assets
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and verify Commons JPEG images
        run: node scripts/sync-photos.mjs
      - name: Commit verified gallery assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/photos
          if git diff --cached --quiet; then
            echo "Photos already up to date"
          else
            git commit -m "assets: store verified Wikimedia destination JPGs locally"
            git push origin HEAD:main
          fi
