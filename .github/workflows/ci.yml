name: Marketing tourism web CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and build
        run: npm run ci
      - uses: actions/upload-artifact@v4
        with:
          name: marketing-turism-web
          path: dist/
          if-no-files-found: error
