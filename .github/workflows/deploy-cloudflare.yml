name: Deploy Tourism Cloudflare (manual)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      ${{ vars.ENABLE_CLOUDFLARE_DEPLOY == 'true' || (github.event_name == 'push' && github.event.head_commit.message == 'ci: attempt isolated tourism deployment once') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated deployment target and code
        run: npm run ci
      - name: Apply D1 migrations
        run: npx --yes wrangler@4 d1 execute marketing-turism-db --remote --file=database/migrations/0009_site_content.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker + assets
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
