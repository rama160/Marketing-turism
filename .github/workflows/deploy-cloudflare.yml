name: Deploy Tourism Cloudflare (manual)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.ENABLE_CLOUDFLARE_DEPLOY == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated deployment target and code
        run: npm run ci
      - name: Diagnose scoped Cloudflare metadata access (status codes only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare GitHub Secrets are missing"; exit 1
          fi
          # Do not print API tokens, response bodies or dashboard bindings.
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          for endpoint in \
            "/workers/scripts/marketing-turism-agent/settings" \
            "/workers/scripts/marketing-turism-agent" \
            "/workers/scripts" \
            "/workers/services" \
            "/workers/subdomain"; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base$endpoint")
            echo "Cloudflare GET $endpoint : HTTP $status"
          done
      - name: Apply D1 migrations
        run: npx --yes wrangler@4 d1 execute marketing-turism-db --remote --file=database/migrations/0009_site_content.sql && npx --yes wrangler@4 d1 execute marketing-turism-db --remote --file=database/migrations/0010_whatsapp_inbox.sql && npx --yes wrangler@4 d1 execute marketing-turism-db --remote --file=database/migrations/0011_marketing_learning.sql && npx --yes wrangler@4 d1 execute marketing-turism-db --remote --file=database/migrations/0012_meta_autopilot.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker + assets
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
